usage: |
  第一次使用

  1. 用盒子账号打开 https://dsbot.<你的盒子>.heiyu.space —— 平台会先要你登录，
     然后直接进入 DS Bot（DSH 的进程令牌由启动脚本自动换成了浏览器 Cookie）
  2. 如果页面回 `dsh web authentication required`：打开应用数据卷里的
     `/data/access.txt`，把里面的 `?token=` 链接访问一次即可
  3. 进入 Settings → Model providers，填一个模型服务（火山方舟示例：API 地址
     `https://ark.cn-beijing.volces.com/api/v3`，OpenAI 兼容协议，模型名照抄
     控制台里已开通的 ID），保存后回聊天页选模型
  4. 在左侧新建一个 Bot，给它发第一条消息

  说明
  - 数据在 /data（profile、会话、bot 团队、密钥）与 /workspace（工作目录），
    重启和升级都不会丢
  - 默认只靠平台登录把门；想要应用自己的密码，在应用设置里加
    `DSBOT_BASIC_AUTH=1`，会自动生成密码并写进 /data/admin.txt
  - 审批默认 Full access：容器即边界，Bot 可以在容器里执行命令
  - 容器里没有 Chrome，浏览器类工具不可用
application:
  subdomain: dsbot
  # 整站都应当先经过平台的账号登录；不放开任何免登录路径。
  public_path: []
  upstreams:
    - location: /
      # 容器内的 Caddy（3080）转给 dsh web 的 127.0.0.1:3081。
      backend: http://dsbot.f00700f.ds-bot.lzcapp:3080
      disable_trim_location: true
services:
  dsbot:
    image: embed:dsbot
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/var/workspace:/workspace
    environment:
      - DSH_HOME=/data
      # 平台终结 TLS，容器里只有 HTTP。run.sh 从平台注入的
      # LAZYCAT_APP_DOMAIN 推出 https://<该域名>；要覆盖（自定义域名）时
      # 解开下面这行。
      # - DSBOT_PUBLIC_URL=https://dsbot.<你的盒子>.heiyu.space/
      # 需要应用自己的 HTTP 基本认证（在平台登录之外再加一道）时设为 1。
      # - DSBOT_BASIC_AUTH=1
      # 保持上游语义：只认一次性的 ?token= 链接，不做自动换取 Cookie。
      # - DSBOT_STRICT_AUTH=1
    # tini reaps the processes bots leave behind and forwards signals; the
    # platform gives no init for a service.
    entrypoint: /usr/bin/tini -g -- /bin/sh /lzcapp/pkg/content/entry.sh
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e
          "require('node:http').get('http://127.0.0.1:3080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      # The first start copies a profile and boots dsh, which loads every plugin.
      start_period: 180s
