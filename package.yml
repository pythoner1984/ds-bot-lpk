# Version tracks this packaging layer, not upstream. The upstream plugin and the
# DSH runtime are pinned by ARG DS_BOT_VERSION / DSH_VERSION in
# image/Dockerfile — bump both places together.
package: f00700f.ds-bot
version: 0.1.11
name: DS Bot
description: 把 DeepSeek Harness 变成一队长期存在的 Bot：每个 Bot 有自己的记忆、模型、工作目录和浏览器，可以在群聊里互相派活。
author: lxf
license: Apache-2.0
homepage: https://github.com/Fei2411/DS-Bot
locales:
  zh-CN:
    name: DS Bot
    description: 运行在 DeepSeek Harness 上的一队 Bot。每个 Bot 是一个独立的会话，有记忆、模型、工作目录，可以在群聊里互相协作。
    usage: |
      DS Bot 是一个装好 DeepSeek Harness 与 ds-bot 插件的 Web 应用。

      首次使用：
      1. 用盒子账号打开应用地址：平台先要你登录，然后直接进入 DS Bot
         （DSH 的进程令牌由启动脚本自动换成浏览器 Cookie）
      2. 若页面回 dsh web authentication required（换了浏览器、清了 Cookie，
         或存着上次的失效 Cookie）：访问同域名下的 /login，它会自动重新换取
         Cookie；仍然不行再看数据卷里的 /data/access.txt
      3. Settings → Model providers 里加一个模型服务（火山方舟示例：API 地址
         https://ark.cn-beijing.volces.com/api/v3，OpenAI 兼容协议，模型名用
         控制台里的 ID）
      4. 回聊天页选模型，新建 Bot，开始对话

      说明：
      - 数据在 /data（profile、会话、团队、密钥）与 /workspace（工作目录），
        重启和升级都不丢
      - 默认只靠平台登录把门；要应用自己的密码就设 DSBOT_BASIC_AUTH=1，
        密码会生成并写进 /data/admin.txt
      - 容器内 Caddy 监听所有网卡，同盒的其他应用理论上能直接访问它；
        多人共用盒子时请加 DSBOT_BASIC_AUTH=1 或 DSBOT_STRICT_AUTH=1
      - 升级镜像时，启动脚本会把 /data 里的 ds-bot 插件换成新镜像自带的版本，
        profile 里的模型设置保持不变
      - 默认 Full access 审批：容器即边界，Bot 可以在容器里执行命令
      - 没有 Chrome，浏览器类工具不可用
  en-US:
    name: DS Bot
    description: Long-lived bots on DeepSeek Harness, each with its own session, memory, model and working folder.
    usage: |
      A web app that ships DeepSeek Harness with the ds-bot plugin installed.

      First run:
      1. Open the app URL: the platform signs you in, then the app exchanges DSH's
         launch token for a browser cookie on its own.
      2. If it answers "dsh web authentication required", open /login on the same
         host to re-mint the cookie; /data/access.txt holds the same link.
      3. Settings -> Model providers: add a provider (e.g. Volcano Ark at
         https://ark.cn-beijing.volces.com/api/v3, OpenAI-compatible, model id
         from the console).
      4. Pick a model, create a bot, send the first message.

      Notes:
      - Data lives in /data (profile, sessions, team, secrets) and /workspace
        (bot working folders) and survives restarts and upgrades.
      - The platform account is the only gate by default. Set DSBOT_BASIC_AUTH=1
        to add an app password (written to /data/admin.txt).
      - Caddy listens on every interface inside the container, so another app on
        the same box could reach it directly. Add DSBOT_BASIC_AUTH=1 or
        DSBOT_STRICT_AUTH=1 when the box is shared.
      - Upgrading the image replaces the ds-bot plugin inside /data; provider
        settings in the profile are left alone.
      - Approval defaults to Full access: the container is the boundary.
      - There is no Chrome in the image, so browser tools are unavailable.
permissions:
  required:
    - net.internet
    # Delegated app-to-app access: lets the bot reach app.<pkg>.lzcx MCP
    # endpoints with the X-HC-USER-TICKET the platform injects on a real user
    # request (lzcos >= 1.5.2).
    - lzcapp.user_delegate
# Projects the box's Skills and MCP providers read-only into
# /lzcapp/run/resources/{skills,mcp-providers} (lzcos >= 1.5.2).
import_resources:
  - kind: skills
  - kind: mcp-providers





